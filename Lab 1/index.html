<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Tinkerbelle</title>

    <meta
      name="viewport"
      content="initial-scale=1,maximum-scale=1,user-scalable=no"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/water.css@2/out/dark.css"
    />
    <link rel="stylesheet" href="static/style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/3.1.1/socket.io.js"></script>
  </head>

  <body>
    <div id="user">
      <button id="control">Jane Wren</button>
      <button id="light">Tinkerbelle</button>
    </div>
    <div id="controlPanel">
      <div class="pickr"></div>
      <br />
	  <!-- Add: Upload audio file -->
      <label>
        Audio File
        <input type="file" id="audioFileIn" accept="audio/*" />
      </label>
      <br /><br />
      <label>
        Audio
        <input type="text" id="audioIn" placeholder="Search freesound.org" />
      </label>
      <br />
      <div style="margin-top: 10px">
        <button id="play">▶️ Play</button>
        <button id="pause">⏸️ Pause</button>
        <button id="stop">⏹️ Stop</button>
      </div>
      <br />
      <div
        id="audioInfo"
        style="font-size: 0.8em; opacity: 0.7; margin-top: 10px"
      ></div>
    </div>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/themes/classic.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/pickr.min.js"></script>
    <script>
      const control = document.getElementById("control");
      const light = document.getElementById("light");
      const play = document.getElementById("play");
      const pause = document.getElementById("pause");
      const audioIn = document.getElementById("audioIn");
      const audio = new Audio();
      let pickr;

      // Add: Audio file element
      const stop = document.getElementById("stop");
      const audioFileIn = document.getElementById("audioFileIn");
      const audioInfo = document.getElementById("audioInfo");
      // Add: Audio analysis variables
      let audioContext;
      let analyser;
      let source;
      let dataArray;
      let animationId;
      let isAudioReactive = false;
      let currentAudioFile = null;

      let socket;
      try {
        socket = io();
        socket.on("connect", () => {
          socket.on("hex", (val) => {
            if (!isAudioReactive) {
              document.body.style.backgroundColor = val;
            }
          });
          socket.on("audio", (val) => {
            getSound(encodeURI(val));
          });
          socket.on("pauseAudio", (val) => {
            audio.pause();
            stopAudioReactivity();
          });
        });
      } catch (e) {
        console.log("Socket.IO not available, running in standalone mode");
        socket = { emit: () => {}, on: () => {} };
      }

      // Add: Initialize audio context and analyser
      const initAudioAnalysis = () => {
        if (!audioContext) {
          audioContext = new (window.AudioContext ||
            window.webkitAudioContext)();
          analyser = audioContext.createAnalyser();
          analyser.fftSize = 256;

          const bufferLength = analyser.frequencyBinCount;
          dataArray = new Uint8Array(bufferLength);

          // Connect audio element to analyser
          source = audioContext.createMediaElementSource(audio);
          source.connect(analyser);
          analyser.connect(audioContext.destination);
        }
      };

      // Add: Convert frequency data to color using HSL
      const frequencyToColorHSL = (dataArray) => {
        // Calculate different frequency ranges
        const bass = dataArray.slice(0, 16);
        const mid = dataArray.slice(16, 64);
        const treble = dataArray.slice(64, 128);

        // Get average values
        const bassAvg = bass.reduce((a, b) => a + b, 0) / bass.length;
        const midAvg = mid.reduce((a, b) => a + b, 0) / mid.length;
        const trebleAvg = treble.reduce((a, b) => a + b, 0) / treble.length;

        // Calculate overall energy
        const totalEnergy = (bassAvg + midAvg + trebleAvg) / 3;

        // Map to HSL - bass affects hue rotation, mid affects saturation, treble affects lightness
        const hue = ((bassAvg / 255) * 360 + Date.now() * 0.01) % 360;
        const saturation = Math.max(30, Math.min(100, (midAvg / 255) * 100));
        const lightness = Math.max(
          20,
          Math.min(80, 30 + (totalEnergy / 255) * 50)
        );

        return `hsl(${Math.floor(hue)}, ${Math.floor(
          saturation
        )}%, ${Math.floor(lightness)}%)`;
      };

      // Add: Audio reactive color animation
      const updateColorFromAudio = () => {
        if (!analyser || !isAudioReactive || audio.paused) {
          animationId = requestAnimationFrame(updateColorFromAudio);
          return;
        }

        analyser.getByteFrequencyData(dataArray);
        const color = frequencyToColorHSL(dataArray);

        // Apply CSS transition for smooth color changes
        document.body.style.transition = "background-color 0.1s ease-out";
        document.body.style.backgroundColor = color;

        // Emit color to other clients if socket is available
        if (socket && socket.emit) {
          socket.emit("hex", color);
        }

        animationId = requestAnimationFrame(updateColorFromAudio);
      };

      // Add: Start audio reactivity
      const startAudioReactivity = () => {
        isAudioReactive = true;
        updateColorFromAudio();
      };

      // Add: Stop audio reactivity
      const stopAudioReactivity = () => {
        isAudioReactive = false;
        if (animationId) {
          cancelAnimationFrame(animationId);
          animationId = null;
        }
      };

      // Add: Upload audio file
      audioFileIn.addEventListener("change", (e) => {
        const file = e.target.files[0];
        if (file) {
          currentAudioFile = file;
          const url = URL.createObjectURL(file);
          audio.src = url;
          audioInfo.textContent = `Loaded: ${file.name}`;
          console.log("Audio file loaded:", file.name);
        }
      });

      // enter controller mode
      control.onclick = () => {
        console.log("control mode");
        // make sure you're not in fullscreen
        if (document.fullscreenElement) {
          document
            .exitFullscreen()
            .then(() => console.log("exited full screen mode"))
            .catch((err) => console.error(err));
        }
        // make buttons and controls visible
        document.getElementById("user").classList.remove("fadeOut");
        document.getElementById("controlPanel").style.opacity = 0.6;
        // Add: stop audio reactivity
        stopAudioReactivity();
        if (!pickr) {
          // create our color picker. You can change the swatches that appear at the bottom
          pickr = Pickr.create({
            el: ".pickr",
            theme: "classic",
            showAlways: true,
            swatches: [
              "rgba(255, 255, 255, 1)",
              "rgba(244, 67, 54, 1)",
              "rgba(233, 30, 99, 1)",
              "rgba(156, 39, 176, 1)",
              "rgba(103, 58, 183, 1)",
              "rgba(63, 81, 181, 1)",
              "rgba(33, 150, 243, 1)",
              "rgba(3, 169, 244, 1)",
              "rgba(0, 188, 212, 1)",
              "rgba(0, 150, 136, 1)",
              "rgba(76, 175, 80, 1)",
              "rgba(139, 195, 74, 1)",
              "rgba(205, 220, 57, 1)",
              "rgba(255, 235, 59, 1)",
              "rgba(255, 193, 7, 1)",
              "rgba(0, 0, 0, 1)",
            ],
            components: {
              preview: false,
              opacity: false,
              hue: true,
            },
          });

          pickr.on("change", (e) => {
            const hexCode = e.toHEXA().toString();
            document.body.style.backgroundColor = hexCode;
            if (socket && socket.emit) {
              socket.emit("hex", hexCode);
            }
          });
        }
      };

      light.onclick = () => {
        // safari requires playing on input before allowing audio
        audio.muted = true;
        audio.play().then((audio.muted = false));
        // in light mode make it full screen and fade buttons
        document.documentElement.requestFullscreen();
        document.getElementById("user").classList.add("fadeOut");
        // if you were previously in control mode remove color picker and hide controls
        if (pickr) {
          // this is annoying because of the pickr package
          pickr.destroyAndRemove();
          document
            .getElementById("controlPanel")
            .append(
              Object.assign(document.createElement("div"), {
                className: "pickr",
              })
            );
          pickr = undefined;
        }
        document.getElementById("controlPanel").style.opacity = 0;

         // Add: Start audio reactivity if audio is playing
        if (!audio.paused) {
          initAudioAnalysis();
          startAudioReactivity();
        }
      };

       // Add: Play button
      play.onclick = () => {
        if (currentAudioFile || audio.src) {
          // Resume audio context if needed
          if (audioContext && audioContext.state === "suspended") {
            audioContext.resume();
          }

          audio
            .play()
            .then(() => {
              console.log("Audio playing");
              audioInfo.textContent = `Playing: ${
                currentAudioFile ? currentAudioFile.name : "Online audio"
              }`;

              // Initialize audio analysis and start reactivity
              initAudioAnalysis();
              startAudioReactivity();
            })
            .catch((err) => {
              console.error("Error playing audio:", err);
              audioInfo.textContent = "Error playing audio";
            });
        } else if (audioIn.value.trim()) {
          // Search and play from freesound.org
          getSound(encodeURI(audioIn.value));
          if (socket && socket.emit) {
            socket.emit("audio", audioIn.value);
          }
        } else {
          audioInfo.textContent = "Please select a file or enter search terms";
        }
      };

       // Add: Pause button
      pause.onclick = () => {
        audio.pause();
        stopAudioReactivity();
        audioInfo.textContent = "Paused";
        if (socket && socket.emit) {
          socket.emit("pauseAudio", "");
        }
      };

       // Add: Stop button
      stop.onclick = () => {
        audio.pause();
        audio.currentTime = 0;
        stopAudioReactivity();
        audioInfo.textContent = currentAudioFile
          ? `Stopped: ${currentAudioFile.name}`
          : "Stopped";
      };

       // Add: Audio event listeners
      audio.addEventListener("play", () => {
        if (audioContext && audioContext.state === "suspended") {
          audioContext.resume();
        }
        // Start reactivity if not in control mode
        if (document.getElementById("controlPanel").style.opacity === "0") {
          initAudioAnalysis();
          startAudioReactivity();
        }
      });

      audio.addEventListener("pause", () => {
        stopAudioReactivity();
      });

      audio.addEventListener("ended", () => {
        stopAudioReactivity();
        audioInfo.textContent = "Audio ended";
      });

      const getSound = (query, loop = false, random = false) => {
        const url = `https://freesound.org/apiv2/search/text/?query=${query}&fields=name,previews&token=U5slaNIqr6ofmMMG2rbwJ19mInmhvCJIryn2JX89&format=json`;
        fetch(url)
          .then((response) => response.json())
          .then((data) => {
            console.log(data);
            if (data.results && data.results.length >= 1) {
              const src = random
                ? data.results[Math.floor(Math.random() * data.results.length)]
                    .previews["preview-hq-mp3"]
                : data.results[0].previews["preview-hq-mp3"];
              audio.src = src;
              audio.play();
              audioInfo.textContent = `Playing: ${data.results[0].name}`;
              console.log("Playing:", src);
            } else {
              audioInfo.textContent = "No audio found for search term";
            }
          })
          .catch((error) => {
            console.error("Error fetching audio:", error);
            audioInfo.textContent = "Error searching for audio";
          });
      };

      audioIn.onkeyup = (e) => {
        if (e.keyCode === 13) {
          play.click();
        }
      };
    </script>
  </body>
</html>
